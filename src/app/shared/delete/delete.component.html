<section
  class="d-flex flex-column justify-content-center align-items-center gap-3 p-4 text-center position-relative"
>
  <img class="w-25" src="../../../assets/images/nodata.svg" alt="noData" />
  <h5 class="m-0">Delete {{ data.name + " " + data.text }}?</h5>
  <p class="text-secondary w-75">
    are you sure you want to delete this item ? if you are sure just click on
    delete it
  </p>
  <button
    mat-button
    [mat-dialog-close]="data.id"
    cdkFocusInitial
    class="bg-danger text-white w-25"
  >
    Ok
  </button>

  <div
    class="position-absolute btn-cancel cursor-pointer"
    (click)="onNoClick()"
  >
    <mat-icon matSuffix>close</mat-icon>
  </div>
</section>
