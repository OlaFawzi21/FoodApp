<section
  class="d-flex flex-column justify-content-center align-items-center gap-3 p-4 text-center"
>
  <img class="w-25" src="../../../assets/images/nodata.svg" alt="noData" />
  <h5 class="m-0">Delete {{ data.name +' '+ data.text }}?</h5>
  <p class="text-secondary w-75">
    are you sure you want to delete this item ? if you are sure just click on
    delete it
  </p>
  <div mat-dialog-actions class="justify-content-end px-4">
    <button mat-button (click)="onNoClick()">Close</button>
    <button mat-button [mat-dialog-close]="data.id" cdkFocusInitial  class="bg-danger text-white">Ok</button>
  </div>
</section>
