<section
  class="nav p-3 my-4 d-flex gap-5 justify-content-center align-items-center second-color"
>
  <div class="position-relative w-75">
    <input
      type="search"
      name="search"
      class="form-control ps-5"
      placeholder="Search here"
    />
    <i class="fa-solid fa-magnifying-glass position-absolute"></i>
  </div>
  <div>
    <img src="../../../assets/images/avatar.png" alt="avatar" />
    <span class="ms-3 fw-bold">{{ username }}</span>
  </div>

  <button
    mat-icon-button
    [matMenuTriggerFor]="menu"
    aria-label="Example icon-button with a menu"
  >
    <mat-icon>arrow_drop_down_circle</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item>
      <mat-icon class="second-color">account_circle</mat-icon>
      <span class="second-color">Profile</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon class="second-color">logout</mat-icon>
      <span class="second-color">Logout</span>
    </button>
  </mat-menu>
</section>
